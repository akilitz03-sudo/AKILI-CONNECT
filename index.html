<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D45">
<title>Upatu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Upatu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --chumvi:#F4F6F1; --karatasi:#FFFFFF; --bahari:#0F3D45; --bahari2:#4B6469;
  --zafarani:#F4B41A; --karafuu:#A83240; --majani:#2F7D4E; --mstari:#DDE3DA;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--chumvi);color:var(--bahari);line-height:1.45;padding-bottom:100px}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;line-height:1.15;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:20px 0 6px}
header h1{font-size:1.35rem;font-weight:800}
header p{color:var(--bahari2);font-size:.92rem;margin-top:2px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--zafarani);outline-offset:2px}

/* Vitufe */
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--bahari);background:var(--bahari);color:#fff;font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;color:var(--bahari)}
.btn.danger{background:var(--karafuu);border-color:var(--karafuu);color:#fff}
.btn.small{min-height:38px;padding:0 14px;font-size:.92rem}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.icon{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--mstari);background:var(--karatasi);font-size:1.4rem;line-height:1;display:grid;place-items:center}
.icon:disabled{opacity:.35}

/* Fomu */
input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--mstari);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:var(--karatasi);color:var(--bahari)}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
label.f{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
.hint{color:var(--bahari2);font-size:.85rem;margin-top:4px}
.switch{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--mstari)}
.switch input{width:22px;height:22px;margin-top:2px;accent-color:var(--bahari);flex:none}
.switch b{display:block}

/* Paneli */
.panel{background:var(--karatasi);border:1px solid var(--mstari);border-radius:16px;margin:14px 0;overflow:hidden}
.panel>.pad{padding:16px}
.panel h2{font-size:1.1rem}
.list{list-style:none}
.list>li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--mstari)}
.list>li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow-wrap:anywhere}
.grow small{color:var(--bahari2);font-size:.85rem}
.amt{font-weight:700;white-space:nowrap}

/* Shujaa ya Leo: mpaka wa kanga */
.hero{background:var(--bahari);color:#fff;border-radius:20px;overflow:hidden;margin:14px 0}
.kanga{height:16px;background-color:var(--zafarani);
  background-image:linear-gradient(135deg,var(--bahari) 25%,transparent 25%),linear-gradient(225deg,var(--bahari) 25%,transparent 25%);
  background-size:16px 16px;background-position:-8px 0,-8px 0}
.hero-body{padding:20px 20px 22px}
.hero-sub{color:var(--zafarani);font-weight:600}
.hero h2{font-size:2.3rem;font-weight:800;margin:4px 0 2px;overflow-wrap:anywhere}
.hero-meta{color:rgba(255,255,255,.75);font-size:.92rem}
.pot{margin-top:18px;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:2rem;font-weight:800;color:var(--zafarani)}
.pot-l{font-size:.9rem;color:rgba(255,255,255,.75)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--zafarani);border-radius:99px;transition:width .3s}
.bar.full i{background:#6FD39A}
.bar-l{font-size:.88rem;margin-top:6px;color:rgba(255,255,255,.85)}

.daynav{display:flex;align-items:center;gap:10px;margin-top:8px}
.daynav .lbl{flex:1;text-align:center;font-weight:600}
.today-link{display:block;margin:8px auto 0}

/* Malipo */
.row-paid .tick{background:var(--majani);border-color:var(--majani);color:#fff}
.tick{min-width:92px;min-height:42px;border-radius:12px;border:1.5px solid var(--karafuu);background:transparent;color:var(--karafuu);font-weight:700}
.row-paid .grow b{color:var(--bahari2)}

.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.ok{background:#DDF1E4;color:var(--majani)}
.chip.now{background:var(--zafarani);color:var(--bahari)}
.chip.late{background:#F6DDE0;color:var(--karafuu)}
.chip.wait{background:#E9EDE6;color:var(--bahari2)}

.no{width:34px;height:34px;border-radius:50%;background:var(--chumvi);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.turn-main{all:unset;flex:1;min-width:0;cursor:pointer;display:block}
.turn-main:focus-visible{outline:3px solid var(--zafarani)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:34px;height:26px;border-radius:8px;border:1.5px solid var(--mstari);background:var(--karatasi);font-size:.8rem;line-height:1}
.mv button:disabled{opacity:.3}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--mstari);background:var(--karatasi);font-size:1.2rem;font-weight:700}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.del{border:0;background:none;color:var(--karafuu);font-weight:600;min-height:38px;padding:0 6px}

.clr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--mstari);cursor:pointer}
.clr input{width:22px;height:22px;accent-color:var(--bahari);flex:none}
.clist{max-height:36vh;overflow:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.cltot{display:flex;justify-content:space-between;padding:10px 0;border-top:1.5px solid var(--bahari);font-weight:700}
.add{display:grid;grid-template-columns:1fr 92px;gap:10px;margin-top:12px}
.add .btn{grid-column:1/-1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--karatasi);border:1px solid var(--mstari);border-radius:14px;padding:14px}
.stat b{display:block;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.35rem;font-weight:800}
.stat.wide{grid-column:1/-1}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dates span,.h3 span{display:block;color:var(--bahari2);font-size:.8rem}
.dates b{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.15rem;font-weight:800}
.dates div+div{border-left:1px solid var(--mstari);padding-left:14px}
.money>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-top:1px solid var(--mstari)}
.money>div:first-child{border-top:0}
.money span{color:var(--bahari2)}
.money b{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.25rem;font-weight:800;white-space:nowrap}
.money .held{background:#FCF0CC}
.money .held span{color:var(--bahari);font-weight:600}
.money .held b{font-size:1.5rem}
.today-name{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
.list>li.hrow{display:block}
.hh{display:flex;align-items:center;gap:10px}
.h3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.h3 b{font-size:.95rem}
.hrow .bar2{margin-top:10px}
.rnote{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.9rem;font-weight:600;background:#DDF1E4;color:var(--majani)}
.rnote.owe{background:#F6DDE0;color:var(--karafuu)}
.rnote small{display:block;font-weight:500;margin-top:2px}
.hero-debt{margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(168,50,64,.35);color:#fff;font-size:.9rem;font-weight:600}
.spanel .sm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:10px;font-size:.92rem}
.spanel .sm span{color:var(--bahari2)}
.spanel .sm b{text-align:right}
.spanel .sm .tot{border-top:1px solid var(--mstari);padding-top:8px;margin-top:2px}
.spanel .sm .tot span{color:var(--bahari);font-weight:700}
.spanel .give{color:var(--majani)}
.spanel .owe{color:var(--karafuu)}
.warnbox{margin:12px 0;padding:12px;border-radius:12px;background:#FFF3D1;border:1.5px solid var(--zafarani);font-size:.92rem;font-weight:600}
.warnbox small{display:block;font-weight:500;margin-top:4px}
.rrow .tick{min-width:0;padding:0 14px}
.tick[aria-pressed="true"]{background:var(--majani);border-color:var(--majani);color:#fff}
.tick[aria-pressed="true"]{background:var(--majani);border-color:var(--majani);color:#fff}
.rtick{min-width:0;padding:0 14px;font-size:.92rem}
.rrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.dtab{margin-top:10px;font-size:.86rem}
.dtab .dr{display:grid;grid-template-columns:20px minmax(0,1fr) 88px 84px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--mstari)}
.dtab .dr.h{font-weight:700;color:var(--bahari);font-size:.78rem}
.dtab .dr>*{min-width:0}
.dtab .dr small{display:block;color:var(--bahari2)}
.dtab .st{font-weight:700;white-space:nowrap;text-align:right;font-size:.82rem}
.dtab .st.ok{color:var(--majani)}.dtab .st.no{color:var(--karafuu)}.dtab .st.own{color:var(--bahari2);font-weight:600}
.dtab .dr b{text-align:right;white-space:nowrap;font-size:.82rem}
.dtab .dr.h span:nth-child(n+3){text-align:right}
details.dd{margin-top:12px;border-top:1px solid var(--mstari);padding-top:10px}
details.dd summary{cursor:pointer;font-weight:700;color:var(--bahari);min-height:40px;display:flex;align-items:center}
.blk{display:block;margin-top:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.segb{flex:1 1 auto;border:1.5px solid var(--mstari);background:var(--karatasi);color:var(--bahari);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.9rem;min-height:44px}
.segb.on{background:var(--bahari);border-color:var(--bahari);color:#fff}
.sumrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fchips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--mstari);background:var(--karatasi);color:var(--bahari);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.88rem;min-height:40px}
.fchip.on{background:var(--bahari);border-color:var(--bahari);color:#fff}
.list small .owe{color:var(--karafuu);font-weight:700}
.list small .okc{color:var(--majani);font-weight:700}
.rlist{list-style:none;margin:8px 0 0;padding:0}
.rlist li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--mstari)}
.rlist li:last-child{border-bottom:0}
.rlist .rn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--majani);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.rlist small{display:block;color:var(--bahari2)}
.rlist small.owe{color:var(--karafuu);font-weight:700}
.rlist small.okc{color:var(--majani);font-weight:700}
.hdebt{margin-top:8px;font-size:.85rem;font-weight:600;color:var(--karafuu)}
body.setup nav{display:none}
body.setup{padding-bottom:40px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.steps i{height:6px;border-radius:99px;background:var(--mstari)}
.steps i.on{background:var(--zafarani)}
.btn.grow-btn{flex:1}
.stat span{color:var(--bahari2);font-size:.85rem}
.mline{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--bahari2)}
.mline b{color:var(--bahari)}
.debt{color:var(--karafuu)!important}

.endbox{background:var(--karatasi);border:1px solid var(--mstari);border-left:5px solid var(--zafarani);border-radius:12px;padding:12px 14px;margin:14px 0}
.endbox b{display:block;font-size:1.02rem}
.endbox span{color:var(--bahari2);font-size:.9rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chumvi);padding:4px;border-radius:14px;margin-top:14px}
.seg button{min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:600;color:var(--bahari2)}
.seg button[aria-pressed=true]{background:var(--bahari);color:#fff}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--chumvi);border-top:1px solid var(--mstari)}
.savebar b{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.2rem}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;cursor:pointer}
.pickrow input{width:24px;height:24px;accent-color:var(--bahari);flex:none}
.hero .btn{background:var(--zafarani);border-color:var(--zafarani);color:var(--bahari);margin-top:16px}
.sumline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:.95rem}
.sumline span{color:var(--bahari2)}
.mcard{background:var(--karatasi);border:1px solid var(--mstari);border-radius:16px;padding:16px;margin:14px 0}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mhead h3{font-size:1.3rem;font-weight:800;overflow-wrap:anywhere}
.mhead .chips{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mhead .tag{margin-left:0}
.mhead2{display:flex;align-items:center;gap:8px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--karafuu);margin-left:8px;vertical-align:middle}
.sechead{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border:0;background:none;text-align:left;color:inherit}
.sechead b{font-size:1rem}
.sechead small{color:var(--bahari2);font-weight:500}
.secbox.open .chev{transform:rotate(180deg)}
.secbody{border-top:1px solid var(--mstari)}
.secbody>.pad>h2:first-child{display:none}
.mtog{flex:1;min-width:0;min-height:48px;padding:0;border:0;background:none;text-align:left;color:inherit}
.mname{display:block;font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:1.25rem;font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.mcode{margin-left:0;flex:none;border:1px dashed var(--bahari2);background:transparent;font-weight:700;letter-spacing:.04em;min-height:34px}
.mcode.soft{font-weight:500;letter-spacing:0}
.chev{flex:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--mstari);background:var(--karatasi);font-size:1.1rem;color:var(--bahari2);transition:transform .2s;display:grid;place-items:center}
.mcard.open .chev{transform:rotate(180deg)}
.mdetail{margin-top:10px;border-top:1px solid var(--mstari)}
.msec{padding:14px 0;border-bottom:1px solid var(--mstari)}
.msec:last-of-type{border-bottom:0}
.phrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.phrow .btn{min-height:46px}
.msec h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--bahari2);margin-bottom:8px}
.mtools{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mtools .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mtools .tag{margin-left:0}
.mdetail .facts{margin-top:4px}
.mdetail .sm{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.mdetail .sm span{color:var(--bahari2)}
.mdetail .sm b{text-align:right}
.mdetail .sm .tot{border-top:1px solid var(--mstari);padding-top:8px;margin-top:2px}
.mdetail .sm .tot span{color:var(--bahari);font-weight:700}
.mdetail .give{color:var(--majani)}
.mdetail .owe{color:var(--karafuu)}
.mdetail details.dd{margin-top:0;border-top:0;padding-top:0}
.mlist>li{padding:10px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.facts span{display:block;color:var(--bahari2);font-size:.82rem}
.facts b{font-size:1.02rem}
.facts .red b{color:var(--karafuu)}
.bar2{height:8px;background:var(--chumvi);border-radius:99px;margin-top:16px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--majani);border-radius:99px}
.kpi{display:grid;grid-template-columns:1fr 1fr}
.kpi>div{padding:14px 16px;border-top:1px solid var(--mstari);min-width:0}
.kpi>div:nth-child(even){border-right:1px solid var(--mstari)}
.kpi span{display:block;color:var(--bahari2);font-size:.8rem}
.kpi b{display:block;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.15rem;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.kpi .big{grid-column:1/-1;border-top:0;border-right:0!important;background:#E6F2EA}
.kpi .big b{font-size:1.8rem;color:var(--majani)}
.kpi .bad b{color:var(--karafuu)}
.narr{font-size:.98rem;line-height:1.5;color:var(--bahari)}
.dline{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--mstari)}
.dline:first-of-type{border-top:0}
.dline span{color:var(--bahari2)}
.dline b{white-space:nowrap;margin-left:auto}
.dline{align-items:center}
.bar2-l{font-size:.82rem;color:var(--bahari2);margin-top:4px}
.zline{margin-top:12px;font-size:.92rem;overflow-wrap:anywhere}
.zline span{color:var(--bahari2)}
.mact{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--mstari)}
.tag{display:inline-block;margin-left:6px;font-size:.78rem;color:var(--bahari2);border:1px solid var(--mstari);border-radius:99px;padding:2px 8px;white-space:nowrap}
.mline.strong{margin-top:6px;padding-top:6px;border-top:1px dashed var(--mstari)}
.empty{text-align:center;padding:36px 8px}
.empty h2{font-size:1.5rem;margin-bottom:8px}
.empty p{color:var(--bahari2);margin-bottom:18px}
.empty .btn{margin:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Nav ya chini */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--karatasi);border-top:1px solid var(--mstari);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--bahari2);position:relative;min-height:58px}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--bahari)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--zafarani)}

/* Hesabu za kutoka na leja */
.btn.outdanger{background:transparent;color:var(--karafuu);border-color:var(--karafuu)}

<script>
'use strict';
/* ========== Msaada wa jumla ========== */
const KEY = 'upatu-data-v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ========== Namba za simu za wanachama (zinabaki kwa kijumbe tu, hazipelekwi kwa wanachama wengine) ========== */
const noPhone = (k, v) => k === 'phone' ? undefined : v;
function normPhone(raw) {
  let d = String(raw || '').replace(/\D/g, ''); if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (/^0\d{9}$/.test(d)) return '255' + d.slice(1);
  if (/^[67]\d{8}$/.test(d)) return '255' + d;
  if (/^255\d{9}$/.test(d)) return d;
  return /^\d{11,15}$/.test(d) ? d : '';
}
const fmtPhone = p => /^255\d{9}$/.test(p || '') ? '0' + p.slice(3, 6) + ' ' + p.slice(6, 9) + ' ' + p.slice(9) : (p ? '+' + p : '');
const waTo = (m, text) => 'https://wa.me/' + (m && m.phone ? m.phone : '') + '?text=' + encodeURIComponent(text);
const smsTo = (m, text) => 'sms:+' + m.phone + '?&body=' + encodeURIComponent(String(text).replace(/\*/g, ''));

const money = n => 'TSh ' + Math.round(n).toLocaleString('en-US');
const DAYS = ['Jumapili','Jumatatu','Jumanne','Jumatano','Alhamisi','Ijumaa','Jumamosi'];
const MONTHS = ['Januari','Februari','Machi','Aprili','Mei','Juni','Julai','Agosti','Septemba','Oktoba','Novemba','Desemba'];
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtLong = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtDate = d => `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ========== Hali ya data ========== */
const defaultState = () => ({
  group: { name: 'Upatu wetu', amount: 1000, start: ymd(new Date()), skipSunday: false, recipientPays: false, posho: 0, kijumbe: '', end: '', cycle: 'members', days: 30, payout: 'turns', freq: 'daily', fn: 3 },
  started: false,
  finished: false,
  finishedOn: '',
  members: [],   // {id, name, shares}
  order: [],     // orodha ya zamu: "memberId#nambaYaHisa"
  paid: {},      // paid[zamu][memberId] = true
  received: {}   // received[zamu] = true
  ,recvLog: []   // mpangilio wa kuthibitisha waliopokea
  ,cashed: {}    // hali ya wote-mwisho: cashed[memberId] = tarehe aliyochukua
  ,cashAmt: {}   // kiasi halisi alichochukua: cashAmt[memberId] = kiasi
  ,repaid: {}    // marejesho: repaid[memberId] = [{d, amount}]
  ,loss: []      // hasara iliyogawanywa: [{id, mid, amt, at, parts:{memberId: kiasi}, tids:[siku zilizofidiwa]}]
  ,history: []   // kumbukumbu za michezo iliyopita (akaunti ni moja)
  ,part: {}      // malipo ya hisa chache: part[zamu][memberId] = idadi ya hisa zilizolipwa
  ,recvAmt: {}   // kiasi halisi kilicholipwa kila zamu wakati wa kupokea (hakibadiliki baadaye)
  ,ledger: []    // leja: kutoka, hisa, marejesho na madeni ya kusuluhisha
  ,exits: []     // walioacha mchezo njiani: {id, mid, name, shares, at, day, of, paid, taken, loss, fee, net, turns, end, lid}
});
let S = defaultState();
let tab = 'nyumbani', view = 0, pending = null, recvFilter = 'all', histOpen = null;
let wizStep = 1, wizShuffle = true;
let payM = null, payDate = '', payMode = 'back', payN = 1;
let payLastKey = '', payLastAt = 0, memAt = '';
const payPick = new Set();
let ROLE = 'admin', hasPin = false;
const shortD = d => `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;

/* ========== Wingu (Firebase) ========== */
const FB_CONFIG = {
  apiKey: "AIzaSyAY6ZqA1DMoij2mNlhvtqDkJvS-LILEP4M",
  authDomain: "upatu-8e0db.firebaseapp.com",
  projectId: "upatu-8e0db",
  storageBucket: "upatu-8e0db.firebasestorage.app",
  messagingSenderId: "492436585357",
  appId: "1:492436585357:web:de55dc7b66052f439ddbc4"
};
const COL = 'upatu_groups', ATKEY = 'upatu-at-v1';
let fbAuth = null, fbDb = null, cloudUser = null, cloudState = '', pushT = null, unsubLive = null, memberGid = '';
let loginErr = '', loginEm = '', loginBusy = false, loginMode = 'in', loginInfo = '';
let lockMe = false, memberCodes = {};
const CODE_COL = 'upatu_codes', CODE_AL = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => { const a = new Uint32Array(6); crypto.getRandomValues(a); let c = ''; for (let i = 0; i < 6; i++) c += CODE_AL[a[i] % CODE_AL.length]; return c; };
const normMCode = v => String(v || '').replace(/[\s-]/g, '').toUpperCase();
const isMCode = v => /^[A-Z0-9]{4,12}$/.test(v);
const dispCode = c => String(c || '').replace(/^([A-Z])([A-Z]*)/, (m, a, b) => a + b.toLowerCase());
const rndL = n => { const a = new Uint32Array(n); crypto.getRandomValues(a); let r = ''; for (let i = 0; i < n; i++) r += 'ABCDEFGHJKMNPQRSTUVWXYZ'[a[i] % 23]; return r; };
const nameLetters = m => { const f = String(m.name || '').trim().split(/\s+/)[0] || ''; const L = f.normalize('NFD').replace(/[^A-Za-z]/g, '').toUpperCase(); return L.length >= 2 ? L : 'UPATU'; };
const memberNo = m => String(Math.max(1, S.members.findIndex(x => x.id === m.id) + 1)).padStart(2, '0');
function codeCands(m, regen) {
  const L = nameLetters(m), nn = memberNo(m), out = [];
  if (!regen) [4, 5, 6].forEach(k => out.push(L.slice(0, k) + nn));
  for (let i = 0; i < 6; i++) out.push(L.slice(0, 4) + nn + rndL(1));
  for (let i = 0; i < 6; i++) out.push(L.slice(0, 4) + nn + rndL(2));
  return [...new Set(out)];
}
const legacyCode = c => !/^[A-Z]{2,}\d{2}/.test(c);
async function lookupCode(code) {
  if (!cloudOn()) return null;
  const doc = await withTimeout(fbDb.collection(CODE_COL).doc(code).get(), 8000);
  return doc.exists ? doc.data() : null;
}
async function loadCodes() {
  memberCodes = {};
  const q = await withTimeout(fbDb.collection(CODE_COL).where('gid', '==', cloudUser.uid).get(), 10000), stale = [];
  q.forEach(d => { const x = d.data(); if (S.members.some(m => m.id === x.mid) && !memberCodes[x.mid]) memberCodes[x.mid] = d.id; else stale.push(d.id); });
  stale.forEach(id => fbDb.collection(CODE_COL).doc(id).delete().catch(() => {}));
}
async function makeCode(m, regen) {
  const taken = new Set(Object.values(memberCodes)), old = memberCodes[m.id];
  for (const code of codeCands(m, regen)) {
    if (taken.has(code)) continue;
    try {
      await withTimeout(fbDb.collection(CODE_COL).doc(code).set({ gid: cloudUser.uid, mid: m.id, name: m.name, at: new Date().toISOString() }), 10000);
      if (old && old !== code) fbDb.collection(CODE_COL).doc(old).delete().catch(() => {});
      memberCodes[m.id] = code; return code;
    } catch (e) { if (!e || e.code !== 'permission-denied') throw e; }
  }
  throw new Error('codes');
}
let codesBusy = false, codesKey = '';
async function ensureCodes() {
  if (codesBusy || !cloudOn() || !cloudUser || !S.members.length) return;
  const key = S.members.map(m => m.id).join(',');
  if (key === codesKey) return;
  codesKey = key; codesBusy = true;
  try {
    await loadCodes();
    for (const m of S.members) if (!memberCodes[m.id] || legacyCode(memberCodes[m.id])) await makeCode(m, false);
  } catch (e) { codesKey = ''; if (!ensureCodes.warned) { ensureCodes.warned = true; toast('Misimbo imeshindikana: ' + ((e && (e.code || e.message)) || 'hitilafu')); } }
  codesBusy = false;
  if (ROLE === 'admin' && tab === 'wanachama') render();
}
async function openCodes() {
  if (!cloudOn() || !cloudUser) { toast('Ingia kwenye akaunti kwanza'); return; }

function lossSplit(amt, list) {

function vZamu() {

function payList() {
  const ds = turnDates(), today = ymd(new Date());
  return S.order.map((tid, i) => ({ tid, i, d: ds[i], o: owed(payM, tid) }))
    .filter(x => x.o > 0 && !(S.paid[x.tid] || {})[payM] && (payMode === 'back' ? ymd(x.d) <= today : ymd(x.d) > today));
}
function payGroups(mid) {
  const ds = turnDates(), g = {};
  S.order.forEach((tid, i) => {
    const v = (S.paid[tid] || {})[mid]; if (!v || owed(mid, tid) <= 0) return;
    const pd = v === true ? ymd(ds[i]) : v;
    (g[pd] || (g[pd] = [])).push({ tid, i });
  });
  return Object.entries(g).sort((a, b) => b[0].localeCompare(a[0]));
}

function finishSummary() {
  const st = stats();
  if (endMode()) {
    const got = S.members.filter(m => isCashed(m.id));
    const totalPaid = st.reduce((a, r) => a + r.paid, 0);
    const recvTotal = got.reduce((a, m) => a + recvAmt(m), 0), fee = got.reduce((a, m) => a + posho() * m.shares, 0);
    const retTotal = S.members.reduce((a, m) => a + returnedAmt(m), 0), holds = holdersList().reduce((a, x) => a + x.amt, 0);
    const taken = recvTotal + fee;
    return { st, N: S.members.length, doneN: got.length, totalPaid, taken, held: totalPaid + retTotal - taken, left: st.reduce((a, r) => a + Math.max(0, r.total - r.paid), 0), fee, recvTotal, retTotal, holds };
  }
  const N = S.order.length;
  const doneN = S.order.filter(t => S.received[t]).length;
  const totalPaid = st.reduce((a, r) => a + r.paid, 0);
  const taken = doneN * payBase();
  const left = st.reduce((a, r) => a + Math.max(0, r.total - r.paid), 0);
  return { st, N, doneN, totalPaid, taken, held: totalPaid - taken, left };
}

function potPreview() {
  const P = pot(), po = posho();
  if (!S.members.length) return 'Ongeza wanachama ili kuona hesabu ya mchezo.';

    if (po > 0) t += ` Kijumbe atapata ${money(totalShares() * po)} mchezo ukiisha.`;
    return t;
  }
  let t = `Mchango wa siku ${money(P)}, posho ${money(po)}, anayepokea anapata ${money(netPot())}.`;
  if (shortfall() > 0) t += ` Mpokeaji analipwa kulingana na siku ${cycleDays()} (${money(payBase())}), lakini kinachokusanywa kwa siku ni ${money(P)}. Pengo la ${money(shortfall())} kwa siku (${money(shortfall() * cycleDays())} kwa mchezo mzima) linabebwa na kijumbe.`;
  if (po > 0) t += ` Kijumbe atapata ${money(S.order.length * po)} mchezo ukiisha.`;
  if (po > P) t += ' Posho ni kubwa kuliko mchango wa siku.';
  return t;
}

// Changanya zamu (idxs) ili jina moja lisijirudie mfululizo
function spreadPool(idxs) {
  const cost = arr => { let c = 0; for (let i = 1; i < arr.length; i++) if (info(arr[i]).m.id === info(arr[i - 1]).m.id) c++; return c; };
  let best = null, bc = Infinity;
  for (let n = 0; n < 300; n++) {
    const p = idxs.map(i => S.order[i]);
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    const full = S.order.slice(); idxs.forEach((oi, x) => full[oi] = p[x]);
    const c = cost(full);
    if (c < bc) { bc = c; best = p; if (c === 0) break; }
  }
  return best;
}

function shuffleTurns() {
  const idxs = S.order.map((t, i) => i).filter(i => !S.received[S.order[i]]);
  if (idxs.length < 2) { toast('Hakuna zamu za kutosha kuchanganya'); return; }
  const pool = spreadPool(idxs);
  const apply = () => { idxs.forEach((oi, n) => S.order[oi] = pool[n]); save(); view = defaultView(); render(); toast('Zamu zimechanganywa'); };
  if (reduced) { apply(); return; }
  const el = $('#modal'), names = S.members.map(m => m.name);

// Jaribio kwenye nakala ya data, bila kugusa data halisi
function simulate(fn) {
  const keep = S; S = JSON.parse(JSON.stringify(S));
  try { const r = fn(); syncOrder(); return { r, sm: statsMap(), shares: totalShares() }; }
  finally { S = keep; }
}
function purgeTids(test) {
  S.order = S.order.filter(t => !test(t));
  [S.paid, S.part, S.received, S.recvAmt].forEach(o => { if (o) Object.keys(o).forEach(t => { if (test(t)) delete o[t]; }); });
  S.recvLog = (S.recvLog || []).filter(x => !test(x.t));
}
// Mwanachama akiacha njiani, tarehe ya mchezo kuisha inashikiliwa ile ile (zamu zilizobaki zinajazwa upya)
function freezeEnd() {
  if (cycleDays() > 0) return ymd(cutoffDate());
  const e = ymd(cutoffDate()), g = S.group;
  g.cycle = 'dates'; g.end = e;
  return e;
}
function mutExit(mid) {
  purgeTids(t => t.startsWith(mid + '#'));
  S.members = S.members.filter(x => x.id !== mid);
  [S.cashed, S.cashAmt, S.repaid].forEach(o => { if (o) delete o[mid]; });
  Object.keys(S.paid).forEach(t => { if (S.paid[t]) delete S.paid[t][mid]; });
  Object.keys(S.part || {}).forEach(t => clearPart(t, mid));
}
function swapPrefixes(A, B) {
  const sw = t => { const i = t.indexOf('@'), p = i < 0 ? t : t.slice(0, i), r = i < 0 ? '' : t.slice(i); return (p === A ? B : p === B ? A : p) + r; };
  S.order = S.order.map(sw);
  ['paid', 'received', 'recvAmt'].forEach(k => { if (!S[k]) return; const n = {}; Object.keys(S[k]).forEach(t => { n[sw(t)] = S[k][t]; }); S[k] = n; });
  S.recvLog = (S.recvLog || []).map(x => Object.assign({}, x, { t: sw(x.t) }));
  (S.loss || []).forEach(l => { l.tids = (l.tids || []).map(sw); });
}
// Hisa ya juu zaidi ambayo zamu zake hazijapokea (ndiyo inayoweza kuondolewa)
function shareDropK(mid) {
  const m = S.members.find(x => x.id === mid);
  for (let k = m.shares; k >= 1; k--) {
    const p = mid + '#' + k;
    if (!S.order.some(t => tidPrefix(t) === p && S.received[t])) return k;
  }
  return 0;
}
function mutDropShare(mid) {
  const m = S.members.find(x => x.id === mid);
  if (!endMode()) {
    const k = shareDropK(mid); if (!k) return false;
    if (k !== m.shares) swapPrefixes(mid + '#' + k, mid + '#' + m.shares);
    const p = mid + '#' + m.shares;
    purgeTids(t => tidPrefix(t) === p);
  }
  m.shares--; if (m.sf) m.sf = m.sf.slice(0, m.shares);
  return true;
}
// Pesa alizochukua ambazo hazijarudi
function cashTaken(m) {
  if (endMode()) return isCashed(m.id) ? Math.max(0, recvAmt(m) - returnedAmt(m)) : 0;
  return S.order.reduce((a, t) => a + (S.received[t] && info(t).m && info(t).m.id === m.id ? recvOf(t) : 0), 0);
}
// Kiasi ambacho kila mtu anarudishiwa = malipo yaliyorekodiwa kabla - baada
const diffs = (bf, sm) => { const o = {}; S.members.forEach(m => { o[m.id] = Math.round(bf[m.id].paid - (sm[m.id] ? sm[m.id].paid : 0)); }); return o; };
function nextTurnDate() { const t = ymd(new Date()), d = turnDates().find(x => ymd(x) > t); return d ? ymd(d) : ymd(addDays(new Date(), 1)); }

function exitPlan(mid) {

  const bf = statsMap(), sim = simulate(() => { freezeEnd(); mutExit(mid); });
  if (sim.shares < minShares()) return { err: `Kundi linahitaji hisa angalau ${minShares()}. Ongeza mwanachama kwanza.` };
  const df = diffs(bf, sim.sm), paid = Math.round(bf[mid].paid), taken = Math.round(cashTaken(m)), loss = Math.round(lossShare(mid));
  const others = S.members.filter(x => x.id !== mid && df[x.id] > 0).map(x => ({ id: x.id, name: x.name, amt: df[x.id] }));
  const mineT = endMode() ? [] : S.order.filter(t => t.startsWith(mid + '#'));
  return { m, paid, taken, loss, others, nTurns: mineT.length, nRecv: mineT.filter(t => S.received[t]).length };
}

function shareDownPlan(mid) {

  if (m.shares <= 1) return { err: 'Ana hisa 1 tu. Tumia "Mtoe kundini" kumtoa kabisa.' };

  if (endMode() && isCashed(mid)) return { err: 'Ameshachukua pesa zake, hawezi kupunguza hisa.' };

    const k = shareDropK(mid); if (!k) return { err: 'Zamu zote za hisa zake zimeshapokea. Hawezi kupunguza hisa.' };
    const i = S.order.indexOf(mid + '#' + k); if (i >= 0 && turnDates()[i]) dropDate = ymd(turnDates()[i]);
  }

  return '\n\n*Walioacha mchezo njiani*\n' + X.map(x => `- ${x.name} (hisa ${x.shares}): aliacha ${fmtLong(new Date(x.at))}, alichangia ${money(x.paid)}${x.fee ? ', makato ' + money(x.fee) : ''}, ${x.net >= 0 ? 'alirudishiwa ' : 'anadaiwa '}${money(Math.abs(x.net))}`).join('\n');
}
function ledgerPanel() {
  const L = ledgerList().filter(x => !x.mid || !S.members.some(m => m.id === x.mid)); if (!L.length) return '';
  const pend = L.filter(x => x.amt && !x.done), hist = L.filter(x => !(x.amt && !x.done)), shown = ledgerAll ? hist : hist.slice(0, 6);
  const pay = pend.filter(x => x.amt > 0).reduce((a, x) => a + x.amt, 0), recv = pend.filter(x => x.amt < 0).reduce((a, x) => a - x.amt, 0);
  const row = ledgerRow;
  return `<section class="panel"><div class="pad"><h2>Leja ya waliotoka kundini</h2>
    <p class="hint">Marejesho na madeni ya waliotoka kundini. Mabadiliko ya wanachama waliopo yako ndani ya kadi ya kila mmoja. Funga kila moja ukishalipa au kupokea pesa.</p>
    ${pend.length ? `<div class="warnbox">Bado ${pend.length} za kusuluhisha<small>${pay ? 'Kundi linatakiwa kulipa ' + money(pay) + '. ' : ''}${recv ? 'Kundi linatakiwa kupokea ' + money(recv) + '.' : ''}</small></div>` : ''}</div>
    <ul class="list">${pend.map(row).join('')}${shown.map(row).join('')}</ul>
    ${hist.length > 6 ? `<div class="pad"><button class="btn ghost small" data-a="lg-more">${ledgerAll ? 'Onyesha chache' : 'Onyesha zote (' + hist.length + ')'}</button></div>` : ''}</section>`;
}

      if (wizShuffle && !endMode()) { const idxs = S.order.map((t, i) => i), pool = spreadPool(idxs); if (pool) idxs.forEach((oi, n) => S.order[oi] = pool[n]); }
      S.started = true; tab = 'nyumbani'; view = defaultView(); save(); render(); window.scrollTo(0, 0);

    }

    case 'report': window.open('https://wa.me/?text=' + encodeURIComponent(finalReport()), '_blank'); break;
    case 'newround':
      ask('Anza mzunguko mpya na wanachama walewale? Mchezo huu utahifadhiwa kwenye Historia, kisha zamu, malipo na mapokezi vitaanza upya.', 'Anza mzunguko mpya', () => {
        const kept = archiveGame();
        S.order = []; S.paid = {}; S.part = {}; S.received = {}; S.recvLog = []; S.recvAmt = {}; S.ledger = []; S.exits = []; S.cashed = {}; S.cashAmt = {}; S.repaid = {}; S.loss = []; S.finished = false; S.finishedOn = ''; S.started = false;
        S.group.start = ymd(new Date()); wizStep = 1; tab = 'nyumbani'; view = 0; save(); render(); window.scrollTo(0, 0);
        toast(kept ? 'Mchezo uliopita umehifadhiwa kwenye Historia' : 'Mzunguko mpya umeanza');
      }); break;
    case 'pmode': payMode = d.v; payPick.clear(); render(); break;
    case 'pfirst': {
      payN = Math.max(1, parseInt($('#pn').value) || 1); payPick.clear();
      payList().slice(0, payN).forEach(x => payPick.add(x.tid)); render(); break;
    }
    case 'pall': payList().forEach(x => payPick.add(x.tid)); render(); break;
    case 'pnone': payPick.clear(); render(); break;
    case 'psave': {
      const sel = payList().filter(x => payPick.has(x.tid));
      if (!sel.length) { toast('Chagua siku za kulipia'); break; }
      if (!payDate) { toast('Chagua tarehe ya kulipa'); break; }

      payPick.clear(); save(); render(); toast('Malipo ya siku ' + sel.length + ' yamehifadhiwa'); break;
    }
    case 'punpay': {

      ask(`Tengua malipo ya ${esc(m.name)} ya tarehe ${shortD(parseD(d.d))}?`, 'Tengua', () => {
        payGroups(m.id).filter(([pd]) => pd === d.d).forEach(([, items]) => items.forEach(x => { delete S.paid[x.tid][m.id]; }));
        save(); render(); toast('Malipo yametenguliwa');

const RKEY = 'upatu-role-v1', MKEY = 'upatu-member-v1', PKEY = 'upatu-pin-v1';

async function kvGet(k) {
  try { if (window.storage) { const r = await window.storage.get(k, false); if (r && r.value != null) return r.value; } } catch (e) {}
  try { return localStorage.getItem(k); } catch (e) {}
  return null;
}
async function kvSet(k, v) {
  try { if (window.storage) { await window.storage.set(k, v, false); return; } } catch (e) {}
  try { localStorage.setItem(k, v); } catch (e) {}
}
async function kvDel(k) {
  try { if (window.storage) await window.storage.delete(k, false); } catch (e) {}
  try { localStorage.removeItem(k); } catch (e) {}
}

/* Kufuli ya PIN (kufuli rahisi kwenye simu hii) */
const hashPin = s => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const str = 'upatu:' + s;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
function askPin(title, hint, okLabel, fn) {

    okLabel, () => fn((($('#pin-in') || {}).value || '').trim()), '');
}

/* Msimbo wa kushiriki (picha ya data kwa wanachama, kusoma tu) */
const toB64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const fromB64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const pipeBytes = async (u8, stream) => { const w = stream.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); };
const hashCode = () => location.hash.startsWith('#m=') ? location.hash.slice(3) : '';
const hashGid = () => { const m = location.hash.match(/^#g=([A-Za-z0-9]{20,40})$/); return m ? m[1] : ''; };
const parseGid = input => { const m = String(input || '').match(/(?:^|[#?&\s])g=([A-Za-z0-9]{20,40})/); return m ? m[1] : ''; };
async function fetchGroup(gid) {
  if (!cloudOn()) return null;
  const doc = await withTimeout(fbDb.collection(COL).doc(gid).get(), 8000);
  if (!doc.exists) return null;
  const d = doc.data(); return { S: parseState(d.data), at: d.at };
}
function stopLive() { if (unsubLive) { try { unsubLive(); } catch (e) {} unsubLive = null; } }
function startLive(gid) {
  stopLive(); if (!cloudOn() || !gid) return;
  unsubLive = fbDb.collection(COL).doc(gid).onSnapshot(doc => {
    if (!doc.exists) return;
    try {
      const d = doc.data(); applySnap({ S: parseState(d.data), at: d.at });
      if (me && !S.members.some(x => x.id === me)) { me = null; lockMe = false; }
      saveMember();
      if (ROLE === 'member') render();
    } catch (e) {}
  }, () => {});
}
function normCode(input) {
  let c = String(input || '').trim(); const i = c.indexOf('#m='); if (i >= 0) c = c.slice(i + 3);
  return c.replace(/^m=/, '').replace(/\s+/g, '');
}
async function encodeSnap() {
  const raw = new TextEncoder().encode(JSON.stringify({ v: 1, at: new Date().toISOString(), S }, noPhone));
  if (window.CompressionStream) { try { return 'G.' + toB64u(await pipeBytes(raw, new CompressionStream('gzip'))); } catch (e) {} }
  return 'R.' + toB64u(raw);
}
async function decodeSnap(input) {
  const c = normCode(input), kind = c.slice(0, 2);
  let u8 = fromB64u(c.slice(2));
  if (kind === 'G.') { if (!window.DecompressionStream) throw new Error('gz'); u8 = await pipeBytes(u8, new DecompressionStream('gzip')); }
  else if (kind !== 'R.') throw new Error('bad');
  const snap = JSON.parse(new TextDecoder().decode(u8));
  if (!snap || !snap.S || !Array.isArray(snap.S.members)) throw new Error('bad');
  return snap;
}
function applySnap(snap) {
  S = Object.assign(defaultState(), snap.S);
  S.group = Object.assign(defaultState().group, snap.S.group || {});
  snapAt = snap.at || '';
}
async function saveMember() { await kvSet(MKEY, JSON.stringify({ code: memberCode, gid: memberGid || undefined, lock: lockMe || undefined, me, cache: memberGid ? { S, at: snapAt } : undefined })); }
async function readMember() {
  const raw = await kvGet(MKEY); if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (o.gid) {
      let snap = null; try { snap = await fetchGroup(o.gid); } catch (e) {}
      if (!snap) snap = o.cache || null;
      if (!snap) return null;
      return { code: 'g=' + o.gid, gid: o.gid, me: o.me || null, lock: !!o.lock, snap };
    }
    return { code: o.code, me: o.me || null, snap: await decodeSnap(o.code) };
  } catch (e) { return null; }
}
async function loadCode() {
  const el = $('#mcode'), rawv = el ? el.value : '', cmm = rawv.match(/[#?&]c=([A-Za-z0-9]{4,12})/), mc = normMCode(cmm ? cmm[1] : rawv);
  if (isMCode(mc)) {
    try { await memberViaCode(mc); ROLE = 'member'; mview = defaultView(); mtab = 'mimi'; render(); window.scrollTo(0, 0); }
    catch (e) { pasteErr = 'Msimbo huu si sahihi, au huna mtandao. Muulize kijumbe wako msimbo sahihi.'; render(); }
    return;
  }
  const gid = parseGid(el ? el.value : '');
  if (gid) {
    lockMe = false;
    try {
      const snap = await fetchGroup(gid); if (!snap) throw new Error('bad');
      const prev = await readMember();
      memberGid = gid; memberCode = 'g=' + gid; applySnap(snap);
      me = prev && prev.gid === gid && snap.S.members.some(x => x.id === prev.me) ? prev.me : null;
      hasSnap = true; ROLE = 'member'; mview = defaultView(); mtab = 'mimi';
      await saveMember(); await kvSet(RKEY, 'member'); startLive(gid);
      render(); window.scrollTo(0, 0);
    } catch (e) { pasteErr = 'Kiungo au msimbo huu si sahihi, au huna mtandao. Omba kijumbe wako akutumie tena.'; render(); }
    return;
  }
  try {
    const snap = await decodeSnap(el ? el.value : '');
    const prev = await readMember();
    memberGid = ''; lockMe = false; stopLive();
    memberCode = normCode(el.value); applySnap(snap);
    me = prev && snap.S.members.some(x => x.id === prev.me) ? prev.me : null;
    hasSnap = true; ROLE = 'member'; mview = defaultView(); mtab = 'mimi';
    await saveMember(); await kvSet(RKEY, 'member');
    render(); window.scrollTo(0, 0);
  } catch (e) { pasteErr = 'Kiungo au msimbo huu si sahihi. Omba kijumbe wako akutumie tena.'; render(); }
}

  if (!fromPop && history.state && history.state.upChat) { try { history.back(); } catch (e) {} }
  updateChatBtn();
}
async function chatSend() {
  const ta = $('#ch-txt'), text = ta.value.trim(); if (!text) return;
  const c = chatCan(); if (!c.ok) { toast(c.why); return; }
  const gid = chatGidNow(); if (!gid) return;
  const now = Date.now(); if (now - chatLastSend < 500) return; chatLastSend = now;
  const isAdm = ROLE === 'admin', kind = isAdm && chatNotice ? 'notice' : 'msg', mm = isAdm ? null : S.members.find(x => x.id === me);
  const name = isAdm ? (String(S.group.kijumbe || '').trim() || 'Admin') : (mm ? mm.name : 'Mwanachama');
  const rec = { mid: chatMe(), name: String(name).slice(0, 40), text: text.slice(0, 1000), kind, at: now };
  ta.value = ''; chatGrow(); chatNotice = false; chatStick = true; drawChat();
  try { await chatCol(gid, 'chat').add(rec); }
  catch (e) { toast('Imeshindikana kutuma. Huenda Rules za gumzo hazijabandikwa, au hujaruhusiwa.'); if (!ta.value) { ta.value = text; chatGrow(); } }
}
async function chatSetCfg(patch) {
  const gid = chatGidNow(); if (!gid || ROLE !== 'admin') return;
  const next = Object.assign({}, chatCfg, patch);
  try { await chatCol(gid, 'chatcfg').doc('cfg').set({ mode: next.mode, muted: next.muted, at: Date.now() }); }
  catch (e) { toast('Imeshindikana kuhifadhi. Hakikisha Rules mpya zimebandikwa.'); }
}
function chatActions(id) {
  const m = chatMsgs.find(x => x.id === id); if (!m || ROLE !== 'admin') return;
  const isMem = m.mid !== 'admin', muted = chatCfg.muted.includes(m.mid);
  $('#modal').innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p>${esc(m.name)}</p><div class="hint" style="margin:6px 0 14px;overflow-wrap:anywhere">${esc(m.text.slice(0, 120))}${m.text.length > 120 ? '...' : ''}</div>
    <div class="btns" style="flex-direction:column"><button class="btn danger" data-c="del" data-id="${esc(m.id)}">Futa ujumbe</button>
    ${isMem ? `<button class="btn ghost" data-c="mute" data-id="${esc(m.mid)}">${muted ? 'Mruhusu aandike tena' : 'Mzuie kuandika'}</button>` : ''}
    <button class="btn ghost" data-a="mcancel">Funga</button></div></div>`;
  $('#modal').hidden = false;
}
function chatMutedList() {
  const list = S.members.filter(x => chatCfg.muted.includes(x.id));
  $('#modal').innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><p>Waliozuiwa kuandika</p>
    ${list.map(x => `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--mstari)"><b class="grow" style="overflow-wrap:anywhere">${esc(x.name)}</b><button class="btn ghost small" data-c="mute" data-id="${esc(x.id)}">Ruhusu</button></div>`).join('') || '<div class="hint" style="margin-top:8px">Hakuna.</div>'}
    <div class="btns" style="margin-top:12px"><button class="btn ghost" data-a="mcancel">Funga</button></div></div>`;
  $('#modal').hidden = false;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  const c = b.dataset.c;
  switch (c) {
    case 'open': openChat(); break;
    case 'close': closeChat(false); break;
    case 'send': chatSend(); break;
    case 'notice': chatNotice = !chatNotice; drawChat(); { const t = $('#ch-txt'); if (t && !t.disabled) t.focus(); } break;
    case 'mode-admin': chatSetCfg({ mode: 'admin' }); break;
    case 'mode-open': chatSetCfg({ mode: 'open' }); break;
    case 'pin': b.classList.toggle('open'); break;
    case 'msg': if (!e.target.closest('a')) chatActions(b.dataset.id); break;
    case 'muted': chatMutedList(); break;
    case 'mute': { const id = b.dataset.id, s = new Set(chatCfg.muted); if (s.has(id)) s.delete(id); else s.add(id); closeModal(); chatSetCfg({ muted: [...s] }); toast(s.has(id) ? 'Amezuiwa kuandika' : 'Ameruhusiwa kuandika'); break; }
    case 'del': { const id = b.dataset.id, gid = chatGidNow();
      ask('Futa ujumbe huu kwa kila mtu?', 'Futa', async () => { try { await chatCol(gid, 'chat').doc(id).delete(); } catch (err) { toast('Imeshindikana kufuta'); } }); break; }
    case 'gologin': closeModal(); ROLE = 'login'; loginErr = ''; loginInfo = ''; loginMode = 'in'; render(); window.scrollTo(0, 0); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'ch-txt') chatGrow(); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'ch-txt' && e.key === 'Enter' && !e.shiftKey && window.matchMedia && matchMedia('(pointer:fine)').matches) { e.preventDefault(); chatSend(); }
  if (e.key === 'Escape' && chatOpen && $('#modal').hidden) closeChat(false);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cpin')) { e.preventDefault(); e.target.classList.toggle('open'); }
});
window.addEventListener('popstate', () => { if (chatOpen) closeChat(true); });
if (window.visualViewport) {
  const vf = () => { if (chatOpen) { chatFit(); const L = $('#ch-list'); if (L && document.activeElement && document.activeElement.id === 'ch-txt') L.scrollTop = L.scrollHeight; } };
  visualViewport.addEventListener('resize', vf); visualViewport.addEventListener('scroll', vf);
}

/* ========== Kuanza ========== */
(async function init() {
  await load();
  hasPin = !!(await kvGet(PKEY));
  const role = await kvGet(RKEY), hc = hashCode(), gh = hashGid(), hasData = S.started || S.members.length > 0;
  cloudUser = await authReady();
  let memberOk = false, linkBad = false, older = false;
  const ch = location.hash.match(/^#c=([A-Za-z0-9]{4,12})$/i);
  if (ch) {
    try {
      await memberViaCode(normMCode(ch[1])); memberOk = true;
      try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    } catch (e) { linkBad = true; }
  } else if (gh) {
    try {
      const snap = await fetchGroup(gh); if (!snap) throw new Error('bad');
      const prev = await readMember();
      memberGid = gh; memberCode = 'g=' + gh; applySnap(snap);
      me = prev && prev.gid === gh && snap.S.members.some(x => x.id === prev.me) ? prev.me : null;
      hasSnap = true; memberOk = true;
      await saveMember(); await kvSet(RKEY, 'member');
      try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
      startLive(gh);
    } catch (e) { linkBad = true; }
  } else if (hc) {
    try {
      const nw = await decodeSnap(hc), prev = await readMember();
      let use = { code: normCode(hc), snap: nw, me: prev ? prev.me : null };
      if (prev && !prev.gid && prev.snap.at && nw.at && prev.snap.at > nw.at) { use = prev; older = true; }
      memberGid = ''; memberCode = use.code; applySnap(use.snap);
      me = use.me && use.snap.S.members.some(x => x.id === use.me) ? use.me : null;
      hasSnap = true; memberOk = true;
      await saveMember(); await kvSet(RKEY, 'member');
      try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    } catch (e) { linkBad = true; }
  } else if (role === 'member') {
    const p = await readMember();
    if (p) {
      memberCode = p.code; memberGid = p.gid || ''; lockMe = !!p.lock; applySnap(p.snap);
      me = p.me && p.snap.S.members.some(x => x.id === p.me) ? p.me : null; hasSnap = true; memberOk = true;
      if (memberGid) startLive(memberGid);
    }
  }
  if (memberOk) { ROLE = 'member'; mview = defaultView(); }
  else if (linkBad) { ROLE = 'paste'; pasteErr = 'Kiungo hiki si sahihi, kimekatika, au huna mtandao. Omba kijumbe wako akutumie tena.'; }
  else if (role === 'admin' || hasData || cloudUser) {
    ROLE = 'admin';
    if (cloudUser) await cloudPull();
    memAt = (await kvGet(ATKEY)) || '';
    syncOrder(); view = defaultView(); wizStep = S.members.length ? 2 : 1;
    ROLE = hasPin ? 'locked' : 'admin';
  } else ROLE = 'welcome';
  render();
  if (older) setTimeout(() => toast('Una taarifa mpya zaidi tayari'), 300);
})();
</script>
